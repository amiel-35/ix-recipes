<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" role="img" aria-labelledby="t d">
  <title id="t">ix-recipes</title>
  <desc id="d">Several ix-skills atoms converge into one recipe: domain know-how built on cognitive moves.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#121a1f"/>
      <stop offset="1" stop-color="#1d2b33"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#7fc8bd" fill-opacity="0.7"/>
    </marker>
  </defs>
  <rect width="1280" height="320" fill="url(#bg)"/>

  <!-- trois atomes (ingrédients) convergent vers une recette -->
  <g transform="translate(90 160)">
    <g stroke="#7fc8bd" stroke-opacity="0.55" stroke-width="2" marker-end="url(#arrow)" fill="none">
      <path d="M30 -80 C 120 -80, 150 -30, 206 -12"/>
      <line x1="30" y1="0" x2="204" y2="0"/>
      <path d="M30 80 C 120 80, 150 30, 206 12"/>
    </g>
    <g fill="#121a1f" stroke="#7fc8bd" stroke-width="2.5">
      <rect x="-22" y="-102" width="44" height="44" rx="10"/>
      <rect x="-22" y="-22" width="44" height="44" rx="10"/>
      <rect x="-22" y="58" width="44" height="44" rx="10"/>
    </g>
    <g fill="#7fc8bd" fill-opacity="0.8">
      <circle cx="0" cy="-80" r="5"/>
      <circle cx="0" cy="0" r="5"/>
      <circle cx="0" cy="80" r="5"/>
    </g>
    <rect x="212" y="-46" width="120" height="92" rx="14" fill="#7fc8bd"/>
    <g stroke="#121a1f" stroke-width="3" stroke-linecap="round" stroke-opacity="0.75">
      <line x1="234" y1="-20" x2="310" y2="-20"/>
      <line x1="234" y1="0" x2="296" y2="0"/>
      <line x1="234" y1="20" x2="304" y2="20"/>
    </g>
  </g>

  <g font-family="Georgia, 'Times New Roman', serif">
    <text x="490" y="150" font-size="74" fill="#eef6f4" letter-spacing="1">ix-recipes</text>
    <text x="493" y="198" font-size="26" fill="#b7d8d2" font-style="italic">Domain recipes on top of ix-skills.</text>
    <text x="493" y="238" font-size="20" fill="#7f9a96">The know-how of a trade, atoms chained into workflows.</text>
  </g>
</svg>
