<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Parcours</title>
<style nonce="{{NONCE}}">
:root {
  --bg: #f7f6f2; --surface: #ffffff; --surface-2: #fbfaf7; --hover: rgba(30, 29, 27, .045); --selected: rgba(30, 29, 27, .075);
  --ink: #1e1d1b; --ink-2: #5d5b55; --ink-3: #8d8b84; --line: rgba(30, 29, 27, .10); --line-2: rgba(30, 29, 27, .18);
  --primary: #1e1d1b; --primary-hover: #3a3936; --on-primary: #ffffff; --accent: #2f5bd3;
  --ok: #2f7d4f; --ok-bg: #e9f3ec; --warn: #855700; --warn-bg: #fbf1dc; --bad: #b23a2e; --bad-bg: #fbe9e6; --run: #2f5bd3; --run-bg: #eaf0fc;
  --warn-dot: #d99a1e; --code-bg: #f1f0eb; --shadow: 0 1px 2px rgba(30, 29, 27, .06), 0 8px 24px rgba(30, 29, 27, .06);
  --sans: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, "Helvetica Neue", sans-serif;
  --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Charter, "Book Antiqua", Georgia, serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --r: 8px; --r-lg: 12px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #191917; --surface: #222220; --surface-2: #1e1e1c; --hover: rgba(255, 255, 255, .05); --selected: rgba(255, 255, 255, .09);
    --ink: #ecebe5; --ink-2: #b3b0a8; --ink-3: #85837c; --line: rgba(255, 255, 255, .09); --line-2: rgba(255, 255, 255, .17);
    --primary: #ecebe5; --primary-hover: #ffffff; --on-primary: #191917; --accent: #8fb0ff;
    --ok: #7bcb99; --ok-bg: #1d3125; --warn: #e6b65c; --warn-bg: #362b15; --bad: #f09186; --bad-bg: #3b201c; --run: #8fb0ff; --run-bg: #1f2a44;
    --warn-dot: #e2a93a; --code-bg: #2a2a27; --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .25);
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 var(--sans); -webkit-font-smoothing: antialiased; }
a { color: var(--accent); text-underline-offset: 2px; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
.muted { color: var(--ink-3); }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---- chrome */
header.bar { position: sticky; top: 0; z-index: 10; display: flex; align-items: center; gap: 12px; height: 52px; padding: 0 20px; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: saturate(1.2) blur(8px); border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: center; gap: 9px; font-weight: 600; letter-spacing: -.01em; text-decoration: none; color: var(--ink); }
.brand .mark { width: 22px; height: 22px; border-radius: 6px; background: var(--primary); color: var(--on-primary); display: grid; place-items: center; font-size: 13px; font-weight: 700; }
.crumb { color: var(--ink-3); display: flex; align-items: center; gap: 8px; min-width: 0; }
.crumb span.t { color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 46vw; }
.bar .push { margin-left: auto; display: flex; align-items: center; gap: 14px; }
.conn { font-size: 12.5px; color: var(--bad); display: none; }
.conn.on { display: inline; }
.switch { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ink-2); cursor: pointer; user-select: none; }
.switch input { appearance: none; width: 30px; height: 18px; border-radius: 9px; background: var(--line-2); position: relative; cursor: pointer; margin: 0; transition: background .15s; }
.switch input::after { content: ""; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: var(--surface); box-shadow: 0 1px 2px rgba(0,0,0,.2); transition: transform .15s; }
.switch input:checked { background: var(--primary); }
.switch input:checked::after { transform: translateX(12px); background: var(--on-primary); }
#banners { max-width: 1180px; margin: 0 auto; padding: 0 20px; }
main { max-width: 1180px; margin: 0 auto; padding: 28px 20px 80px; }

.nav { display: flex; gap: 2px; }
.nav a { font-size: 13.5px; color: var(--ink-2); text-decoration: none; padding: 5px 10px; border-radius: var(--r); }
.nav a:hover { background: var(--hover); color: var(--ink); }
.nav a[aria-current="page"] { background: var(--selected); color: var(--ink); font-weight: 500; }
.crumb a { color: var(--ink-3); text-decoration: none; } .crumb a:hover { color: var(--ink); }

/* ---- buttons */
.btn { text-decoration: none; display: inline-flex; align-items: center; justify-content: center; gap: 7px; height: 34px; padding: 0 14px; border-radius: var(--r); border: 1px solid var(--line-2); background: var(--surface); color: var(--ink); cursor: pointer; font-size: 14px; font-weight: 500; white-space: nowrap; transition: background .12s, border-color .12s; }
.btn:hover { background: var(--surface-2); border-color: var(--ink-3); }
.btn.primary { background: var(--primary); border-color: var(--primary); color: var(--on-primary); }
.btn.primary:hover { background: var(--primary-hover); border-color: var(--primary-hover); }
.btn.ghost { border-color: transparent; background: transparent; color: var(--ink-2); }
.btn.ghost:hover { background: var(--hover); color: var(--ink); }
.btn.danger { color: var(--bad); }
.btn.icon { width: 32px; height: 32px; padding: 0; }
.btn[aria-busy="true"] { pointer-events: none; opacity: .75; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.spin { width: 14px; height: 14px; border-radius: 50%; border: 2px solid currentColor; border-right-color: transparent; animation: spin .8s linear infinite; flex: none; }
@keyframes spin { to { transform: rotate(360deg); } }
.row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.grow { flex: 1; min-width: 0; }

/* ---- home */
.page-head { display: flex; align-items: flex-end; gap: 16px; margin: 0 0 24px; }
.page-head h1 { font-size: 26px; letter-spacing: -.02em; margin: 0; font-weight: 600; }
.page-head p { margin: 4px 0 0; color: var(--ink-2); }
.group-title { font-size: 12.5px; font-weight: 600; color: var(--ink-3); text-transform: none; letter-spacing: .01em; margin: 26px 0 10px; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }
.card { display: block; text-decoration: none; color: inherit; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 16px 18px 14px; transition: border-color .12s, box-shadow .12s; }
a.card:hover { border-color: var(--line-2); box-shadow: var(--shadow); }
.card .ttl { font-weight: 600; font-size: 15.5px; letter-spacing: -.01em; margin: 0 0 2px; }
.card .sub { color: var(--ink-3); font-size: 13px; }
.card .state { display: flex; align-items: center; gap: 7px; margin: 14px 0 10px; font-size: 13.5px; color: var(--ink-2); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ink-3); flex: none; }
.dot.warn { background: var(--warn-dot); } .dot.ok { background: var(--ok); } .dot.bad { background: var(--bad); } .dot.run { background: var(--run); animation: pulse 1.4s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .35; } }
.progress { display: flex; gap: 3px; }
.progress i { flex: 1; height: 4px; border-radius: 2px; background: var(--line); }
.progress i.done { background: var(--ok); } .progress i.now { background: var(--warn-dot); } .progress i.run { background: var(--run); } .progress i.bad { background: var(--bad); } .progress i.skip { background: var(--line); opacity: .5; }
.card .foot { display: flex; justify-content: space-between; margin-top: 10px; font-size: 12.5px; color: var(--ink-3); }
.filters { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; margin: 0 0 6px; }
.search { max-width: 320px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font: inherit; font-size: 13px; padding: 5px 11px; border-radius: 999px; border: 1px solid var(--line-2); background: var(--surface); color: var(--ink-2); cursor: pointer; display: inline-flex; gap: 6px; align-items: center; }
.chip:hover { border-color: var(--ink-3); color: var(--ink); }
.chip.on { background: var(--primary); border-color: var(--primary); color: var(--on-primary); }
.chip .n { font-variant-numeric: tabular-nums; opacity: .75; }
.more { margin-top: 10px; }
.archives-link { margin-top: 30px; font-size: 13.5px; }
.archive-row { display: flex; align-items: center; gap: 12px; padding: 14px 18px; border-bottom: 1px solid var(--line); }
.archive-row:last-child { border-bottom: 0; }
.archive-row .ttl { font-weight: 600; } .archive-row .sub { color: var(--ink-3); font-size: 13px; }
.empty { text-align: center; padding: 56px 20px; background: var(--surface); border: 1px dashed var(--line-2); border-radius: var(--r-lg); }
.empty h2 { margin: 0 0 6px; font-size: 19px; }
.empty p { color: var(--ink-2); margin: 0 0 18px; }

/* ---- new */
.narrow { max-width: 760px; margin: 0 auto; }
.field { margin: 0 0 22px; }
.field > label, .field > .label { display: block; font-weight: 600; font-size: 14px; margin: 0 0 4px; }
.field .hint { color: var(--ink-2); font-size: 13px; margin: 0 0 10px; }
.input, textarea.input { width: 100%; padding: 9px 12px; border: 1px solid var(--line-2); border-radius: var(--r); background: var(--surface); outline: none; }
.input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent); }
textarea.input { min-height: 220px; resize: vertical; line-height: 1.5; }
textarea.input.mono { font: 13px/1.5 var(--mono); }
.choices { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; }
.choice { position: relative; display: block; padding: 14px 16px; border: 1px solid var(--line-2); border-radius: var(--r-lg); background: var(--surface); cursor: pointer; }
.choice:hover { border-color: var(--ink-3); }
.choice input { position: absolute; opacity: 0; }
.choice.on { border-color: var(--primary); box-shadow: 0 0 0 1px var(--primary) inset; }
.choice:has(input:focus-visible), .drop:has(input:focus-visible) .btn { outline: 2px solid var(--accent); outline-offset: 2px; }
.action h2:focus { outline: none; }
.choice .ttl { font-weight: 600; }
.choice .desc { color: var(--ink-2); font-size: 13px; margin-top: 4px; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
.choice .steps { color: var(--ink-3); font-size: 12.5px; margin-top: 8px; }
.drop { border: 1px dashed var(--line-2); border-radius: var(--r); padding: 10px 12px; color: var(--ink-2); font-size: 13px; display: flex; align-items: center; gap: 10px; margin-top: 8px; }
.drop.over { border-color: var(--accent); background: var(--run-bg); }
.form-foot { display: flex; align-items: center; gap: 10px; border-top: 1px solid var(--line); padding-top: 18px; }

/* ---- dossier */
.dossier-head { margin: 0 0 22px; }
.dossier-head h1 { font-size: 24px; letter-spacing: -.02em; margin: 0; font-weight: 600; }
.dossier-head .meta { color: var(--ink-3); font-size: 13.5px; margin-top: 4px; display: flex; gap: 6px 14px; flex-wrap: wrap; }
.layout { display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: 28px; align-items: start; }
nav.rail { position: sticky; top: 76px; }
nav.rail ol { list-style: none; margin: 0; padding: 0; }
nav.rail li a { display: flex; gap: 10px; align-items: flex-start; padding: 8px 10px; border-radius: var(--r); text-decoration: none; color: var(--ink-2); }
nav.rail li a:hover { background: var(--hover); color: var(--ink); }
nav.rail li a[aria-current="page"] { background: var(--selected); color: var(--ink); }
nav.rail .ic { width: 18px; height: 18px; flex: none; margin-top: 1px; display: grid; place-items: center; }
nav.rail .nm { font-size: 14px; line-height: 1.35; }
nav.rail .st { display: block; font-size: 12px; color: var(--ink-3); margin-top: 1px; }
nav.rail .st.warn { color: var(--warn); } nav.rail .st.bad { color: var(--bad); } nav.rail .st.run { color: var(--run); }
nav.rail li.skipped .nm { text-decoration: line-through; color: var(--ink-3); }
nav.rail .sep { height: 1px; background: var(--line); margin: 8px 10px; }
.ic svg { width: 18px; height: 18px; }
.c-ok { color: var(--ok); } .c-warn { color: var(--warn-dot); } .c-bad { color: var(--bad); } .c-run { color: var(--run); } .c-mute { color: var(--ink-3); }

.action { border-radius: var(--r-lg); padding: 16px 18px; margin: 0 0 18px; border: 1px solid var(--line); background: var(--surface); }
.action.warn { background: var(--warn-bg); border-color: transparent; }
.action.bad { background: var(--bad-bg); border-color: transparent; }
.action.ok { background: var(--ok-bg); border-color: transparent; }
.action.run { background: var(--run-bg); border-color: transparent; }
.action h2 { font-size: 15.5px; margin: 0; font-weight: 600; letter-spacing: -.005em; }
.action.warn h2 { color: var(--warn); } .action.bad h2 { color: var(--bad); } .action.ok h2 { color: var(--ok); } .action.run h2 { color: var(--run); }
.action p.lead { margin: 3px 0 0; color: var(--ink-2); font-size: 14px; }
.action .btns { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 14px; }
.action .note { font-size: 12.5px; color: var(--ink-2); margin-top: 10px; }
.action .callout { margin-top: 12px; padding: 12px 14px; border-radius: var(--r); background: var(--surface); border: 1px solid var(--line); }
.action textarea.input { min-height: 170px; margin-top: 12px; background: var(--surface); }
.action label.check { display: flex; gap: 10px; align-items: flex-start; padding: 8px 0; cursor: pointer; }
.action label.check input { margin-top: 4px; }

.doc-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); }
.doc-bar { display: flex; align-items: center; gap: 8px; padding: 10px 12px 10px 22px; border-bottom: 1px solid var(--line); min-height: 52px; }
.doc-bar .ttl { font-weight: 600; font-size: 14px; }
.doc-bar .when { color: var(--ink-3); font-size: 12.5px; }
.doc-bar .tools { margin-left: auto; display: flex; gap: 2px; align-items: center; }
.doc { padding: 34px 56px 48px; }
.placeholder { padding: 56px 40px; text-align: center; color: var(--ink-2); }
.placeholder .big { font-size: 16px; color: var(--ink); font-weight: 600; margin-bottom: 4px; }
.skeleton { padding: 36px 56px; }
.print-head { display: none; }
.skeleton i { display: block; height: 12px; border-radius: 6px; background: var(--line); margin: 0 0 14px; animation: pulse 1.6s ease-in-out infinite; }

/* ---- the document itself */
.md { font-family: var(--serif); font-size: 17px; line-height: 1.68; color: var(--ink); max-width: 74ch; overflow-wrap: anywhere; }
.md > :first-child { margin-top: 0; }
.md h2, .md h3, .md h4, .md h5, .md h6 { font-family: var(--sans); letter-spacing: -.01em; line-height: 1.3; }
.md h2 { font-size: 25px; font-weight: 650; margin: 36px 0 12px; }
.md h3 { font-size: 19px; font-weight: 600; margin: 32px 0 10px; }
.md h4 { font-size: 16.5px; font-weight: 600; margin: 24px 0 8px; }
.md h5, .md h6 { font-size: 15px; font-weight: 600; margin: 20px 0 6px; color: var(--ink-2); }
.md p { margin: 0 0 14px; }
.md ul, .md ol { margin: 0 0 14px; padding-left: 26px; }
.md li { margin: 3px 0; }
.md li > ul, .md li > ol { margin: 4px 0; }
.md strong { font-weight: 650; }
.md code { font: .84em var(--mono); background: var(--code-bg); padding: 1px 5px; border-radius: 4px; }
.md pre.code { font: 13px/1.5 var(--mono); background: var(--code-bg); padding: 12px 14px; border-radius: var(--r); overflow: auto; margin: 0 0 16px; }
.md pre.code code { background: none; padding: 0; font-size: inherit; }
.md blockquote { margin: 0 0 16px; padding: 2px 0 2px 16px; border-left: 3px solid var(--line-2); color: var(--ink-2); }
.md hr { border: 0; border-top: 1px solid var(--line); margin: 28px 0; }
.md .tbl { overflow-x: auto; margin: 0 0 18px; border: 1px solid var(--line); border-radius: var(--r); }
.md table { border-collapse: collapse; width: 100%; font-family: var(--sans); font-size: 14px; line-height: 1.45; }
.md th, .md td { text-align: left; vertical-align: top; padding: 9px 12px; border-bottom: 1px solid var(--line); }
.md th { background: var(--surface-2); font-weight: 600; color: var(--ink-2); }
.md tr:last-child td { border-bottom: 0; }
.md del { color: var(--ink-3); }
.md .task { font-family: var(--sans); color: var(--ink-3); margin-right: 4px; }
.md.compact { font-size: 15px; line-height: 1.6; max-width: none; }

/* ---- context sheet */
.sheet { padding: 0 56px 40px; }
.doc-bar + .sheet { padding-top: 28px; border-bottom: 1px solid var(--line); }
.sheet h3 { font-size: 14px; font-weight: 600; margin: 0 0 4px; }
.sheet .hint { color: var(--ink-2); font-size: 13px; margin: 0 0 14px; }
.sheet dl { display: grid; grid-template-columns: minmax(130px, 200px) minmax(0, 1fr); gap: 0; margin: 0; border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.sheet dt, .sheet dd { padding: 10px 14px; border-bottom: 1px solid var(--line); margin: 0; }
.sheet dt { color: var(--ink-2); font-size: 13.5px; background: var(--surface-2); font-weight: 500; }
.sheet dd { white-space: pre-wrap; font-size: 14.5px; }
.sheet dl > :nth-last-child(-n+2) { border-bottom: 0; }
.sheet .edit-row { margin: 0 0 14px; }
.sheet .edit-row label { display: block; font-size: 13.5px; font-weight: 600; margin: 0 0 4px; }
.sheet .edit-row .def { font-size: 12.5px; color: var(--ink-3); margin: 0 0 6px; }
.sheet textarea.input { min-height: 64px; }
.err-inline { color: var(--bad); font-size: 13px; margin-top: 6px; }

/* ---- technical details */
.tech { border-top: 1px solid var(--line); padding: 16px 22px 20px; background: var(--surface-2); border-radius: 0 0 var(--r-lg) var(--r-lg); font-size: 13.5px; }
.tech h4 { font-size: 12px; font-weight: 600; color: var(--ink-3); margin: 0 0 8px; letter-spacing: .02em; }
.kv { display: grid; grid-template-columns: max-content 1fr; gap: 3px 16px; margin: 0 0 12px; }
.kv dt { color: var(--ink-3); } .kv dd { margin: 0; overflow-wrap: anywhere; }
details.sub { border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); margin: 8px 0; }
details.sub > summary { cursor: pointer; padding: 8px 12px; font-weight: 500; list-style: none; display: flex; gap: 8px; align-items: center; }
details.sub > summary::-webkit-details-marker { display: none; }
details.sub > summary::before { content: "›"; color: var(--ink-3); transition: transform .12s; display: inline-block; }
details.sub[open] > summary::before { transform: rotate(90deg); }
details.sub > .in { padding: 4px 12px 12px; }
pre.raw { font: 12.5px/1.5 var(--mono); background: var(--code-bg); padding: 10px 12px; border-radius: 6px; overflow: auto; white-space: pre-wrap; word-break: break-word; max-height: 480px; margin: 6px 0 0; }
.engine-pick { display: flex; align-items: center; gap: 8px; margin: 0 0 12px; }
select.input { width: auto; padding: 5px 10px; }

/* ---- banners, toast, dialog */
.banner { margin: 14px 0 0; padding: 10px 14px; border-radius: var(--r); font-size: 14px; display: flex; gap: 10px; align-items: center; }
.banner.bad { background: var(--bad-bg); color: var(--bad); }
.banner.warn { background: var(--warn-bg); color: var(--warn); }
.banner .grow { color: inherit; }
#toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(20px); background: var(--primary); color: var(--on-primary); padding: 10px 16px; border-radius: var(--r); font-size: 14px; box-shadow: var(--shadow); opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; z-index: 30; max-width: calc(100vw - 32px); }
#toast.on { opacity: 1; transform: translateX(-50%) translateY(0); }
dialog { border: 0; border-radius: var(--r-lg); padding: 0; width: min(480px, calc(100vw - 32px)); background: var(--surface); color: var(--ink); box-shadow: 0 24px 60px rgba(0,0,0,.25); }
dialog::backdrop { background: rgba(20, 19, 17, .42); }
dialog .dlg { padding: 22px 22px 18px; }
dialog h2 { margin: 0 0 8px; font-size: 17px; }
dialog p { margin: 0 0 8px; color: var(--ink-2); }
dialog .btns { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; }

/* ---- personal recipes */
.badge.mine { background: var(--ok-bg); color: var(--ok); }
.empty.small { padding: 22px 20px; text-align: left; display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
.empty.small p { margin: 0; flex: 1; min-width: 220px; }
.badge { display: inline-block; font: 600 11px/1.6 var(--sans); letter-spacing: .02em; padding: 0 7px; border-radius: 999px; background: var(--run-bg); color: var(--run); margin-left: 8px; vertical-align: 2px; }
.tabs { display: flex; gap: 2px; flex-wrap: wrap; border-bottom: 1px solid var(--line); margin: 0 0 18px; }
.tabs a { padding: 8px 12px; font-size: 14px; color: var(--ink-2); text-decoration: none; border-bottom: 2px solid transparent; margin-bottom: -1px; }
.tabs a:hover { color: var(--ink); }
.tabs a[aria-current="page"] { color: var(--ink); border-bottom-color: var(--primary); font-weight: 500; }
.recipe-view { padding: 24px 40px 36px; }

// ===========================================================================
// <markdown-renderer>
// Safe Markdown -> HTML. Engine outputs are untrusted text (they may quote a hostile
// specification), so EVERY piece of text goes through escapeHtml() first; the only markup in
// the result is what this code emits itself: p, br, h2-h6, ul, ol (start), li, strong, em, del,
// code, pre, div.tbl, table, thead, tbody, tr, th, td, blockquote, hr, span.task, and a with an
// http(s) href only (target=_blank, rel=noopener noreferrer). No raw HTML, no images.
// Document headings start at h2: the page owns h1. HTML comments are dropped.
// Tested under node by tests/test_interface.py (RendererTests).
// ===========================================================================
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];

function inlineSpans(escaped) {
  return escaped
    .replace(/\*\*([^*]+?)\*\*/g, '<strong>$1</strong>')
    .replace(/__([^_]+?)__/g, '<strong>$1</strong>')
    .replace(/(^|[^*\w])\*([^*\s][^*]*?)\*(?!\*)/g, '$1<em>$2</em>')

  var m = /^\[([ xX])\][ \t]+(.*)$/.exec(text);

// ===========================================================================
// What a parcours waits for
// ===========================================================================
function stepOf(p, id) { return p.steps.filter(function (s) { return s.id === id; })[0]; }
function stuckSteps(p) { return p.steps.filter(function (s) { return s.status === 'failed' || s.status === 'running'; }); }
// One of: recipe_error, completed, stopped, running, stuck, validate, answers, choose, run.
function kindOf(p) {
  if (p.recipe_error) return 'recipe_error';
  if (p.status === 'completed') return 'completed';
  if (p.status !== 'active') return 'stopped';
  if (p.locked) return 'running';
  if (stuckSteps(p).length) return 'stuck';
  return p.pending ? p.pending.type : 'run';
}
// The step the human should look at now.
function focusStep(p) {
  var k = kindOf(p);
  if (k === 'running') {   // the lock is taken a moment before a step is marked running, and released after
    return p.steps.filter(function (s) { return s.status === 'running'; })[0] ||
      p.steps.filter(function (s) { return s.status === 'pending' || s.status === 'paused'; })[0] || p.steps[p.steps.length - 1];
  }
  if (k === 'stuck') return stuckSteps(p)[0];
  if ((k === 'validate' || k === 'answers') && p.pending.step) return stepOf(p, p.pending.step);
  if (k === 'completed' && p.final_output) return p.steps.filter(function (s) { return s.output === p.final_output; })[0];
  var done = p.steps.filter(function (s) { return s.status === 'done'; });
  return done.length ? done[done.length - 1] : p.steps[0];
}
// Steps the next run would play after the pause at index `from` (0-based) is lifted.
function upcoming(p, from) {
  var out = [];
  for (var i = from + 1; i < p.steps.length; i++) {
    var s = p.steps[i];
    if (s.status !== 'pending') continue;
    if (s.optional && !s.chosen) break;
    out.push(s);
    if (s.pause === 'validate' || s.pause === 'answers') break;
  }
  return out;
}
function costNote(p, steps, from) {
  if (!steps.length) {
    var later = p.steps.slice(from + 1).filter(function (s) { return s.status === 'pending'; });
    if (!later.length) return 'Ce sera la fin du dossier.';
    var optional = [];
    for (var i = 0; i < later.length && later[i].optional && !later[i].chosen; i++) optional.push(stepName(later[i]));
    return optional.length ? 'Ensuite, vous choisirez de jouer ou non : ' + optional.join(', ') + '.' : '';
  }
  var engine = S.engine[p.slug] || p.engine, claude = steps.filter(function (s) { return (p.engine_steps[s.id] || engine) === 'claude'; }).length;
  var names = steps.map(stepName).join(', ');
  var text = 'Ensuite : ' + names + '.';
  if (claude && S.tech) text += ' Plafond de sécurité ' + usd(claude * (p.max_budget_usd || 5) * 2) + ' (' + claude + ' appel(s) Claude × ' + usd(p.max_budget_usd || 5) + ' × 2 pour une relance éventuelle).';
  return text;
}

}

  (p.files || []).filter(function (f) { return f.indexOf(base + '.') === 0 && /\.v\d+\.md$/.test(f); }).forEach(function (f) { files.push(['Version précédente (' + f + ')', 'raw:' + f, f]); });
  return h('div', { class: 'tech' },
    h('h4', null, 'Détails techniques'),
    h('dl', { class: 'kv' },
      h('dt', null, 'Étape'), h('dd', null, s.id + ' · ' + (s.skill && s.skill.ref || '') + (s.skill && s.skill.version ? ' ' + s.skill.version : '')),
      h('dt', null, 'Moteur'), h('dd', null, (ENGINE_FR[engine] || engine) + (engine === 'claude' || engine === 'fake' ? ' · ' + (s.model || 'modèle par défaut') : ' · modèle par défaut du moteur')),
      h('dt', null, 'Coût'), h('dd', null, s.cost_usd ? usd(s.cost_usd) : '—'),
      s.started ? [h('dt', null, 'Durée'), h('dd', null, fmtDate(s.started) + (s.ended && s.ended !== s.started ? ' → ' + fmtDate(s.ended) : ''))] : null,
      h('dt', null, 'Pause'), h('dd', null, { validate: 'relecture', answers: 'réponses d’un tiers', none: 'aucune' }[s.pause] || s.pause || '—'),
      s.mission ? [h('dt', null, 'Mission'), h('dd', { lang: 'en' }, s.mission)] : null),
    s.error ? subDetails('Erreur', 'err:' + s.id, h('pre', { class: 'raw' }, s.error)) : null,
    s.summary ? subDetails('Résumé transmis', 'sum:' + s.id, mdBox(s.summary, 'compact')) : null,
    s.handoff ? subDetails('Champs transmis aux étapes suivantes (' + Object.keys(s.handoff).length + ')', 'hf:' + s.id,
      Object.keys(s.handoff).map(function (f) { return h('div', { style: 'margin:8px 0 14px' }, h('div', { style: 'font: 12px var(--mono);color:var(--ink-3);margin-bottom:4px' }, f), mdBox(s.handoff[f], 'compact')); })) : null,
    files.map(function (f) { return fileDetails(f[0], f[1], f[2]); }),
    s.status === 'running' || S.open.has('log') ? subDetails('Journal du lancement', 'log', h('pre', { class: 'raw' }, S.log && S.log.exists ? S.log.log : 'Aucun journal.')) : null);
}
function engineSelect(value, engines, onchange) {
  var list = engines.slice(); if (list.indexOf(value) < 0) list.unshift(value);
  return h('select', { class: 'input', 'aria-label': 'Moteur', onchange: function (e) { onchange(e.target.value); e.target.blur(); } },
    list.map(function (e) { return h('option', { value: e, selected: e === value }, ENGINE_FR[e] || e); }));
}
function subDetails(title, key, content) {
  return h('details', { class: 'sub', open: S.open.has(key), 'data-key': key }, h('summary', null, title), S.open.has(key) ? h('div', { class: 'in' }, content) : null);
}
function fileDetails(title, key, name) {
  var open = S.open.has(key), entry = S.files.get(name), box = null;
  if (open) box = !entry || entry.text === undefined ? h('p', null, entry && entry.error ? entry.error : 'Chargement…') : h('pre', { class: 'raw' }, entry.text);
  return h('details', { class: 'sub', open: open, 'data-key': key, 'data-file': name }, h('summary', null, title), open ? h('div', { class: 'in' }, box) : null);
}

// ---- documents and files: fetched when shown, refreshed when the state fingerprint moves
function wantDocs() {
  var p = S.p;
  if (!p || S.route.view !== 'parcours' || p.slug !== S.route.slug) return;
  var sel = S.route.step && S.route.step !== 'demande' ? stepOf(p, S.route.step) : (S.route.step ? null : focusStep(p));
  var names = [];
  if (sel && sel.output) names.push(sel.output);
  var k = kindOf(p);
  if (k === 'answers') { var a = stepOf(p, p.pending.step); if (a && a.output) names.push(a.output); }
  names.forEach(function (name) {
    var entry = S.docs.get(name);
    if (entry && (entry.fp === p.fingerprint || entry.loading)) return;
    S.docs.set(name, Object.assign({}, entry, { loading: true }));
    api('GET', slugPath(p.slug) + '/document/' + encodeURIComponent(name), undefined, 20000).then(function (d) {
      S.docs.set(name, { document: d.document, meta: d.meta, fp: S.p ? S.p.fingerprint : '' });
    }).catch(function (e) {
      S.docs.set(name, Object.assign({}, entry, { loading: false, error: 'Lecture impossible : ' + e.message, fp: S.p ? S.p.fingerprint : '' }));
    }).then(function () { S.sig = ''; render(); });
  });
}
function wantFiles() {
  if (!S.p || S.route.view !== 'parcours') return;
  var wanted = [];
  document.querySelectorAll('details[data-file]').forEach(function (el) { if (el.open) wanted.push(el.getAttribute('data-file')); });
  if (S.route.step === 'demande') wanted.push('input.md');
  wanted.forEach(function (name) {
    var entry = S.files.get(name);
    if (entry && (entry.loading || (entry.text !== undefined && entry.fp === S.p.fingerprint) || (name === 'input.md' && entry.text !== undefined))) return;
    S.files.set(name, Object.assign({}, entry, { loading: true }));
    api('GET', slugPath(S.route.slug) + '/file/' + encodeURIComponent(name), undefined, 20000).then(function (d) {
      S.files.set(name, { text: d.text, truncated: d.truncated, fp: S.p ? S.p.fingerprint : '' });
    }).catch(function (e) {
      S.files.set(name, { error: 'Lecture impossible : ' + e.message, fp: S.p ? S.p.fingerprint : '' });
    }).then(function () { S.sig = ''; render(); });
  });
}
async function docText(p, s) {
  var entry = S.docs.get(s.output);
  if (entry && entry.document !== undefined && entry.fp === p.fingerprint) return entry.document;
  var d = await api('GET', slugPath(p.slug) + '/document/' + encodeURIComponent(s.output), undefined, 20000);
  return d.document;
}
async function copyDoc(p, s) {
  try { await copyText(await docText(p, s)); toast('Texte copié'); }
  catch (e) { S.error = 'Copie impossible : ' + e.message; renderChrome(); }
}
async function copyText(text) {
  try { await navigator.clipboard.writeText(text); return; } catch (e) { /* fall through to the old way */ }
  var area = h('textarea', { 'aria-hidden': 'true', style: 'position:absolute;left:-9999px' });
  area.value = text; document.body.appendChild(area); area.select();
  try { document.execCommand('copy'); } finally { area.remove(); }
}
async function downloadDoc(p, s) {
  try {
    var text = await docText(p, s);
    var name = (p.slug + '-' + s.id).replace(/[^a-z0-9-]/g, '') + '.md';
    var url = URL.createObjectURL(new Blob([text], { type: 'text/markdown;charset=utf-8' }));
    var a = h('a', { href: url, download: name }); document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
  } catch (e) { S.error = 'Téléchargement impossible : ' + e.message; renderChrome(); }
}
function printDoc(p, s) {
  if (S.route.step !== s.id) go(dossierHash(p.slug, s.id));
  var tries = 0;
  (function whenReady() {   // never print the loading skeleton
    var entry = S.docs.get(s.output);
    if (entry && entry.document !== undefined && document.querySelector('.doc .md')) window.print();
    else if (++tries < 50) setTimeout(whenReady, 100);
  })();
}

// ===========================================================================
// Actions: each human gesture, then the run up to the next pause
// ===========================================================================
var chainDepth = 0;
// A gesture followed by the launch: the clicked button stays busy, and every other one disabled, until the end.
async function inChain(label, fn) {
  if (S.busy) return;
  if (isEditing()) document.activeElement.blur();
  chainDepth++; S.busy = label; S.error = ''; render();
  try { return await fn(); }
  finally {
    chainDepth--;
    if (!chainDepth) {
      S.busy = ''; await refreshNow();
      if (document.activeElement === document.body) { var t = document.querySelector('.action h2'); if (t) t.focus({ preventScroll: true }); }
    }
  }
}
async function post(action, body, busyLabel) {
  var slug = S.route.slug;
  if (isEditing()) document.activeElement.blur();
  if (!chainDepth) { S.busy = busyLabel || '…'; S.error = ''; render(); }
  try {
    var r = await api('POST', slugPath(slug) + '/' + action, body || {}, 150000);
    if (r && r.notice && r.notice.kind === 'context_stale') toast('Fiche corrigée : les étapes déjà jouées ont reçu l’ancienne version.');
    return r || {};
  } catch (e) {
    S.error = friendlyError(e);
    return null;
  } finally { if (!chainDepth) S.busy = ''; await refreshNow(); }
}
// Server refusals in plain words; the original message stays in the console.
function friendlyError(e) {
  var code = e && e.code, msg = String(e && e.message || '');
  if (window.console && msg) console.warn(code, msg);
  if (code === 'state_changed') return 'Le dossier a changé entre-temps : rien n’a été lancé. Réessayez.';
  if (code === 'running' || code === 'locked') return 'Une étape tourne déjà sur ce dossier. Attendez qu’elle finisse.';
  if (code === 'not_owned') return 'Cette étape a été lancée hors de la page : arrêtez-la depuis la fenêtre où elle tourne.';
  if (code === 'network') return msg;
  if (/attend une pause|en attente : rien|pas de pause/.test(msg)) return 'Le dossier a avancé entre-temps ; la page vient d’être mise à jour.';
  if (code === 'leak') return 'Le résultat recopie un passage de la demande d’origine. Refaites l’étape.';
  if (code === 'interface_bug' || code === 'internal' || code === 'unexpected' || code === 'unreadable')
    return 'Un problème technique est survenu ; le détail est dans la fenêtre où tourne la page de suivi.';
  return humanError(msg);
}

// Launch the steps up to the next pause: plan (fingerprint), then `next`.
async function continueRun(slug, base) {
  slug = slug || S.route.slug; base = base || apiBase();
  var path = base + '/parcours/' + encodeURIComponent(slug);
  if (!chainDepth) { S.busy = 'Lancement…'; render(); }
  try {
    var engine = S.engine[slug];
    var plan = await api('GET', path + '/plan' + (engine ? '?engine=' + encodeURIComponent(engine) : ''), undefined, 30000);
    if (!plan.runnable) return;
    if (plan.agy_over_limit) { S.error = 'Le texte à transmettre dépasse la limite d’Antigravity : choisissez un autre moteur dans les détails techniques.'; return; }
    if (base !== '/api' && !(await confirmPaidEssai(plan))) return;   // a test dossier spends nothing unless asked
    await api('POST', path + '/next', { fingerprint: plan.fingerprint, engine: engine }, 30000);
    S.engine[slug] = undefined;
    if (S.tech && plan.warnings && plan.warnings.length) toast(plan.warnings[0]);
  } catch (e) {
    S.error = friendlyError(e);
  } finally { if (!chainDepth) S.busy = ''; await refreshNow(); }
}
async function validateAndContinue(p, dirty) {
  var body = {};
  if (dirty) { var sheet = sheetFromDraft(p); if (!sheet) return; body.context = sheet; }
  await inChain('Validation…', async function () {
    if (await post('validate', body)) { delete S.ctx[p.slug]; S.ctxEdit[p.slug] = false; await continueRun(p.slug); }
  });
}
async function answerAndContinue(p, key, none) {
  var text = S.answers[p.slug] || '';
  if (!none && !text.trim()) { S.error = 'Collez les réponses reçues, ou choisissez « Continuer sans réponses ».'; renderChrome(); return; }
  if (none && !(await ask('Continuer sans réponses ?', ['Les points ouverts resteront des hypothèses pour la suite du dossier.']
    .concat(text.trim() ? ['Le texte déjà collé sera ignoré.'] : []), 'Continuer sans réponses'))) return;
  var sheet = null;
  if (ctxDirty(p)) { sheet = sheetFromDraft(p); if (!sheet) return; }
  await inChain(none ? 'Suite…' : 'Envoi…', async function () {
    if (sheet) { if (!(await post('validate', { context: sheet }))) return; delete S.ctx[p.slug]; S.ctxEdit[p.slug] = false; }
    if (await post('answer', none ? { none: true } : { text: text })) {
      delete S.answers[p.slug]; save('localStorage', key, null);
      await continueRun(p.slug);
    }
  });
}
async function chooseAndContinue(p, run) {
  await inChain(run ? 'Lancement…' : 'Suite…', async function () {
    if (await post('choose', run ? { run: run } : { skip: true })) await continueRun(p.slug);
  });
}
async function rerunAndContinue(p, s) {
  var after = p.steps.slice(p.steps.indexOf(s) + 1).filter(function (x) { return ['done', 'paused', 'failed'].indexOf(x.status) >= 0; });
  var body = ['L’étape repart de zéro, avec un nouvel appel au moteur.'];
  body.push(after.length ? 'Les étapes suivantes déjà jouées seront refaites aussi : ' + after.map(stepName).join(', ') + ' (' + plural(after.length + 1, 'nouvel appel', 'nouveaux appels') + ' en tout, au fil des relectures).'
    : 'Aucune autre étape n’est touchée.');
  body.push('Les anciennes versions restent consultables dans les détails techniques.');
  if (!(await ask('Refaire « ' + stepName(s) + ' » ?', body, 'Refaire l’étape'))) return;
  await inChain('Relance…', async function () {
    if (await post('rerun', { step: s.id })) { go(dossierHash(p.slug, s.id)); await continueRun(p.slug); }
  });
}
async function retryAndContinue(p) {
  await inChain('Reprise…', async function () { if (await post('retry', {})) await continueRun(p.slug); });
}
async function stopDossier(p) {
  if (!(await ask('Arrêter le dossier ?', ['Vous décidez de ne pas aller plus loin. Le dossier ne pourra plus avancer ; les étapes jouées restent consultables.'], 'Arrêter le dossier', true))) return;
  if (await post('validate', { stop: true }, 'Arrêt…')) toast('Dossier arrêté');
}
async function interrupt() {
  if (!(await ask('Interrompre l’étape en cours ?', ['L’appel au moteur est coupé ; ce qu’il a déjà coûté reste dû. Vous pourrez reprendre ou refaire l’étape ensuite.'], 'Interrompre', true))) return;
  await post('stop', {}, 'Arrêt…');
}

// ===========================================================================
// Wiring
// ===========================================================================
document.addEventListener('toggle', function (e) {
  var el = e.target, key = el.getAttribute && el.getAttribute('data-key');
  if (!key || el.open === S.open.has(key)) return;   // opened by render() itself: nothing changed
  if (el.open) S.open.add(key); else S.open.delete(key);
  if (el.open) { S.sig = ''; render(); if (key === 'log' && S.route.slug) loadLog(S.route.slug).then(render); }
}, true);
document.addEventListener('pointerdown', function () { S.down = true; }, true);
document.addEventListener('pointerup', function () { S.down = false; setTimeout(flush, 80); }, true);
document.addEventListener('pointercancel', function () { S.down = false; setTimeout(flush, 80); }, true);
document.addEventListener('focusout', function () { setTimeout(flush, 250); }, true);
window.addEventListener('hashchange', function () {
  if (/(?:^#|&)t=/.test(location.hash)) initToken();
  var before = S.route; S.route = parseRoute();
  if (S.route.view !== 'parcours' || before.slug !== S.route.slug || before.essai !== S.route.essai) { S.p = null; S.log = null; S.files = new Map(); S.docs = new Map(); }
  if (S.route.view !== 'draft' || before.draft !== S.route.draft) { S.d = null; S.dlog = null; }
  if (S.route.view !== 'personal' || before.id !== S.route.id) { S.pr = null; }
  if (S.route.view !== 'provided' || before.id !== S.route.id) { S.fr = null; }
  S.notFound = false;
  if (S.route.view === 'new' && S.recipesError) { S.recipesError = ''; S.recipes = null; }   // try again
  if (S.route.view === 'archives') { S.archives = null; loadArchives(); }
  S.sig = ''; render(); refreshNow(); window.scrollTo(0, 0);
});
$('#tech-toggle').addEventListener('change', function (e) { S.tech = e.target.checked; save('localStorage', TECH_KEY, S.tech ? '1' : null); S.sig = ''; render(); poll(); });
setInterval(function () { document.querySelectorAll('[data-since]').forEach(function (el) { el.textContent = elapsed(el.getAttribute('data-since')); }); }, 1000);

initToken();
loadDraft();
S.recipeFilter = saved('localStorage', 'parcours-ui:recipe') || '';
S.tech = saved('localStorage', TECH_KEY) === '1';
S.viewMode = saved('localStorage', VIEW_KEY) || 'cards';
S.route = parseRoute();
render();
poll();
setInterval(poll, 3000);
setInterval(updateConn, 1000);
</script>
